<!DOCTYPE html><html><head><title>Fraud Detection Realtime</title><style>body{font-family:Arial;background:#0f172a;color:white;padding:20px}.card{background:#1e293b;padding:20px;border-radius:12px;max-width:600px;margin:auto}input,select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none}button{background:#ef4444;color:white;padding:12px;width:100%;border:none;border-radius:8px;font-weight:bold;cursor:pointer}.result{margin-top:15px;padding:15px;border-radius:10px;text-align:center}</style></head><body><div class='card'><h2>FRAUD DETECTION - REALTIME</h2><label>Amount (Rs)</label><input id='amount' type='number' value='75000'><label>Night Transaction?</label><select id='is_night'><option value='1'>Yes - Night</option><option value='0'>No - Day</option></select><label>Foreign Location?</label><select id='is_foreign'><option value='1'>Yes - Foreign</option><option value='0'>No - India</option></select><label>New Device?</label><select id='is_new_device'><option value='1'>Yes - New Device</option><option value='0'>No - Known Device</option></select><label>Txns in Last 1 Hour</label><input id='txn_count_1h' type='number' value='8'><button onclick='check()'>CHECK FRAUD SCORE</button><div id='out'></div></div><script>async function check(){let d={amount:document.getElementById('amount').value,is_night:document.getElementById('is_night').value,is_foreign:document.getElementById('is_foreign').value,is_new_device:document.getElementById('is_new_device').value,txn_count_1h:document.getElementById('txn_count_1h').value};let r=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});let j=await r.json();document.getElementById('out').innerHTML=<div class='result' style='background:'><h1> / 100</h1><h3></h3><p></p></div>}</script></body></html>
